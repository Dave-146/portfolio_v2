<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailJS Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>EmailJS Configuration Test</h1>
    
    <div class="test-section">
        <h3>1. Configuration Check</h3>
        <div id="config-result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Simple Email Test</h3>
        <button onclick="testSimpleEmail()">Send Test Email</button>
        <div id="test-result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Template Variables Test</h3>
        <button onclick="testTemplateVariables()">Test Template Variables</button>
        <div id="template-result"></div>
    </div>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./js/emailjs-config.js"></script>
    
    <script>
        // Check configuration on page load
        document.addEventListener('DOMContentLoaded', function() {
            const configDiv = document.getElementById('config-result');
            
            if (!window.EMAILJS_CONFIG) {
                configDiv.innerHTML = '<div class="error">❌ EmailJS_CONFIG not found</div>';
                return;
            }
            
            const config = window.EMAILJS_CONFIG;
            let configHtml = '<div class="info">';
            configHtml += `<strong>Public Key:</strong> ${config.PUBLIC_KEY}<br>`;
            configHtml += `<strong>Service ID:</strong> ${config.SERVICE_ID}<br>`;
            configHtml += `<strong>Template ID:</strong> ${config.TEMPLATE_ID}<br>`;
            configHtml += '</div>';
            
            // Check if values are still placeholders
            if (config.PUBLIC_KEY === 'YOUR_PUBLIC_KEY_HERE' || 
                config.SERVICE_ID === 'YOUR_SERVICE_ID_HERE' || 
                config.TEMPLATE_ID === 'YOUR_TEMPLATE_ID_HERE') {
                configHtml += '<div class="error">❌ Configuration still contains placeholder values</div>';
            } else {
                configHtml += '<div class="success">✅ Configuration looks good</div>';
            }
            
            configDiv.innerHTML = configHtml;
        });
        
        async function testSimpleEmail() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.innerHTML = '<div class="info">Sending test email...</div>';
            
            try {
                // Initialize EmailJS
                emailjs.init(window.EMAILJS_CONFIG.PUBLIC_KEY);
                
                // Simple test parameters
                const templateParams = {
                    from_name: 'Test User',
                    from_email: 'test@example.com',
                    message: 'This is a test message from the EmailJS test page.',
                    to_name: 'Dave Crean'
                };
                
                console.log('Sending test email with params:', templateParams);
                
                const response = await emailjs.send(
                    window.EMAILJS_CONFIG.SERVICE_ID,
                    window.EMAILJS_CONFIG.TEMPLATE_ID,
                    templateParams
                );
                
                resultDiv.innerHTML = '<div class="success">✅ Test email sent successfully! Check your inbox.</div>';
                console.log('EmailJS Response:', response);
                
            } catch (error) {
                console.error('EmailJS Test Error:', error);
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.status} - ${error.text || error.message}</div>`;
            }
        }
        
        async function testTemplateVariables() {
            const resultDiv = document.getElementById('template-result');
            resultDiv.innerHTML = '<div class="info">Testing different variable combinations...</div>';
            
            // Test different variable name combinations
            const testCases = [
                {
                    name: 'Standard variables',
                    params: {
                        from_name: 'Test User',
                        from_email: 'test@example.com',
                        message: 'Test message',
                        to_name: 'Dave Crean'
                    }
                },
                {
                    name: 'Alternative variable names',
                    params: {
                        name: 'Test User',
                        email: 'test@example.com',
                        message: 'Test message',
                        to_name: 'Dave Crean'
                    }
                },
                {
                    name: 'Minimal variables',
                    params: {
                        from_name: 'Test User',
                        message: 'Test message'
                    }
                }
            ];
            
            for (const testCase of testCases) {
                try {
                    console.log(`Testing ${testCase.name}:`, testCase.params);
                    
                    const response = await emailjs.send(
                        window.EMAILJS_CONFIG.SERVICE_ID,
                        window.EMAILJS_CONFIG.TEMPLATE_ID,
                        testCase.params
                    );
                    
                    resultDiv.innerHTML += `<div class="success">✅ ${testCase.name} - Success!</div>`;
                    break; // Stop on first success
                    
                } catch (error) {
                    resultDiv.innerHTML += `<div class="error">❌ ${testCase.name} - Error ${error.status}</div>`;
                }
            }
        }
    </script>
</body>
</html>
